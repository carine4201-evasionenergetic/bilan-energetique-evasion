<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan Énergétique by Évasion</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#edf8ef,#ffffff,#f7f3ea);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

background:white;

width:90%;

max-width:750px;

padding:60px;

border-radius:25px;

box-shadow:0 20px 60px rgba(0,0,0,.15);

text-align:center;

}

h1{

font-size:46px;

color:#2d5b3f;

margin-bottom:20px;

}

h2{

font-size:24px;

color:#6b7c67;

margin-bottom:35px;

font-weight:400;

}

p{

font-size:20px;

line-height:1.7;

color:#555;

margin-bottom:45px;

}

button{

background:#4b8f55;

color:white;

border:none;

padding:18px 45px;

font-size:22px;

border-radius:50px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

background:#3c7644;

}

footer{

margin-top:40px;

font-size:15px;

color:#888;

}

</style>

</head>

<body>

<div class="card">

<h1>🌿 Bilan Énergétique by Évasion</h1>

<h2>Découvrez votre Signature Énergétique</h2>

<p>

Chaque pierre raconte une histoire…<br>

Répondez à 15 questions intuitives et découvrez les pierres qui vous correspondent le mieux aujourd'hui.

</p>

<button>

✨ Découvrir ma Signature Énergétique

</button>

<footer>

Créé avec ❤ par Évasion

</footer>

</div>

</body>
